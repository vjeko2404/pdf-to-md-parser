server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types has no .mjs entry, so ES module scripts (the
    # pdf.js worker, built as *.mjs) would fall back to application/octet-stream
    # and get rejected by strict MIME checking. Serve them as JavaScript.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # SPA — let the React router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → the .NET backend (compose service "api").
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100m;   # allow large PDF uploads
    }

    # SignalR hub (WebSocket upgrade).
    location /hub/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
