<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- near-dark base: purple only hinted, deepening to near-black -->
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1d44"/>
      <stop offset="0.55" stop-color="#160e2a"/>
      <stop offset="1" stop-color="#070410"/>
    </linearGradient>
    <!-- big specular highlight: light entering the glass from upper-left -->
    <radialGradient id="spec" cx="0.32" cy="0.2" r="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e9deff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- refraction glow pooling at the bottom edge -->
    <radialGradient id="refract" cx="0.7" cy="1.02" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#c9b6ff" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#9d7bff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#9d7bff" stop-opacity="0"/>
    </radialGradient>
    <!-- edge vignette so the rim reads as light bending around the glass -->
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.72" gradientUnits="objectBoundingBox">
      <stop offset="0.6" stop-color="#1c0a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#120527" stop-opacity="0.45"/>
    </radialGradient>
    <!-- diagonal gloss sweep across the upper third (wet-glass reflection) -->
    <linearGradient id="sweep" x1="0" y1="0" x2="512" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- glossy rim: bright highlight top, dim sides, soft reflection bottom -->
    <linearGradient id="ring" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.12" stop-color="#ddd0ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="0.92" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="arrow" x1="224" y1="256" x2="320" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece1ff"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0a55" flood-opacity="0.28"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#2a0a55" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- frosted glass tile: tint + layered light, all clipped to the squircle -->
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#refract)"/>
    <rect width="512" height="512" fill="url(#spec)"/>
    <rect width="512" height="512" fill="url(#sweep)"/>
    <rect width="512" height="512" fill="url(#vignette)"/>
  </g>

  <!-- thin glossy rim at the very edge -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#ring)" stroke-width="3.5"/>

  <!-- back ghost sheet, tilted -->
  <g filter="url(#soft)" transform="rotate(-9 168 256)">
    <rect x="74" y="128" width="158" height="236" rx="20" fill="#ffffff" opacity="0.42"/>
  </g>

  <!-- PDF source sheet -->
  <g filter="url(#soft)">
    <path d="M80 132 h104 l40 40 v200 a16 16 0 0 1 -16 16 H80 a16 16 0 0 1 -16 -16 V148 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
    <path d="M184 132 v24 a16 16 0 0 0 16 16 h24 z" fill="#d9c6ff"/>
    <rect x="88" y="306" width="92" height="34" rx="8" fill="#6d18f0"/>
    <text x="134" y="331" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
    <rect x="88" y="206" width="112" height="12" rx="6" fill="#cdb6f5"/>
    <rect x="88" y="232" width="112" height="12" rx="6" fill="#e6dafb"/>
    <rect x="88" y="258" width="72" height="12" rx="6" fill="#e6dafb"/>
  </g>

  <!-- MD output sheet -->
  <g filter="url(#soft)">
    <path d="M328 132 h104 l40 40 v200 a16 16 0 0 1 -16 16 H328 a16 16 0 0 1 -16 -16 V148 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
    <path d="M432 132 v24 a16 16 0 0 0 16 16 h24 z" fill="#d9c6ff"/>
    <g transform="translate(336 300)">
      <rect x="0" y="0" width="120" height="62" rx="12" fill="none" stroke="#6d18f0" stroke-width="9"/>
      <path d="M22 46 V16 l15 17 15 -17 v30" fill="none" stroke="#6d18f0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M88 16 v20 m-12 -12 12 13 12 -13" fill="none" stroke="#6d18f0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <rect x="336" y="206" width="112" height="12" rx="6" fill="#cdb6f5"/>
    <rect x="336" y="232" width="112" height="12" rx="6" fill="#e6dafb"/>
    <rect x="336" y="258" width="72" height="12" rx="6" fill="#e6dafb"/>
  </g>

  <!-- conversion arrow, drawn on top and centered in the gap -->
  <g filter="url(#soft2)">
    <path d="M222 256 h54 v-24 l44 36 -44 36 v-24 h-54 z" fill="url(#arrow)" stroke="#6d18f0" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
